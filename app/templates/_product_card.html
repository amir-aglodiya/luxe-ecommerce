<article class="product-card"><a href="{{ url_for('product', product_id=product.id) }}" class="product-image"><img src="{{ product.image }}" alt="{{ product.name }}"><span class="quick-view">View piece ↗</span></a><div class="product-meta"><div><p class="product-category">{{ product.category }}</p><h3>{{ product.name }}</h3></div><strong>₹{{ '%.0f'|format(product.price) }}</strong></div></article>
