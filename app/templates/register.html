{% extends 'base.html' %}
{% block title %}Create account{% endblock %}
{% block content %}<section class="auth-page"><div><p class="eyebrow">Join the studio</p><h1>Make room for<br><em>good things.</em></h1></div><form class="auth-form" method="post"><label for="name">Full name</label><input id="name" name="name" required><label for="email">Email</label><input id="email" name="email" type="email" required><label for="phone">Phone</label><input id="phone" name="phone" required><label for="address">Address</label><textarea id="address" name="address" rows="3" required></textarea><label for="password">Password</label><input id="password" name="password" type="password" minlength="6" required><button class="button button-dark full" type="submit">Create account <span>↗</span></button><p>Already a member? <a href="{{ url_for('login') }}">Sign in</a></p></form></section>{% endblock %}
